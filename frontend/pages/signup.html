<!DOCTYPE html>
<html lang="en" data-guest-only>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="sig.doctitle">Medic Care | Sign Up</title>
    <link rel="icon" type="image/png" href="../assets/medic-care-favicon.png">
    <script src="../script/auth.js"></script>
    <script src="../script/languages.js"></script>
    <script src="../script/theme.js"></script>
    <link rel="stylesheet" href="../styles/medic-care.css">
    <link rel="stylesheet" href="../styles/polish.css">
</head>
<body data-page="signup">

    <main class="signup-container">
        <form class="signup-form" id="signupForm" novalidate>
            <img class="page-brand-logo" src="../assets/medic-care-logo.png" alt="Medic Care">
            <h1 data-i18n="sig.h1">Create your account</h1>
            <p class="subtitle" data-i18n="sig.sub">Let's get started!</p>

            <div class="form-group">
                <label for="name" data-i18n="prof.name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" data-i18n-ph="prof.ph.name" autocomplete="name" maxlength="200" required>
                <div class="msg" id="nameMsg"></div>
            </div>

            <div class="form-group">
                <label for="email" data-i18n="sig.id">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email address" data-i18n-ph="sig.id.ph" autocomplete="username" required>
                <div class="msg" id="idMsg"></div>
            </div>

            <div class="form-group extracted-inline-style-1">
                <label for="password" data-i18n="sig.pw">Password</label>
                <input type="password" id="password" name="password" placeholder="Create your password" data-i18n-ph="sig.pw.ph" autocomplete="new-password" required class="extracted-inline-style-2">
                <button type="button" class="eye extracted-inline-style-3" id="eye1" aria-label="Show password" onclick="toggleSignupPassword('password', 'eye1')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                        <line id="eye1-slash" x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                </button>
                <div class="msg" id="pwMsg"></div>
            </div>

            <div class="form-group extracted-inline-style-4">
                <label for="confirmPassword" data-i18n="sig.cf">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" data-i18n-ph="sig.cf.ph" autocomplete="new-password" required class="extracted-inline-style-5">
                <button type="button" class="eye extracted-inline-style-6" id="eye2" aria-label="Show password" onclick="toggleSignupPassword('confirmPassword', 'eye2')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                        <line id="eye2-slash" x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                </button>
                <div class="msg" id="cfMsg"></div>
            </div>

            <button type="submit" class="create-button" id="submitBtn" data-i18n="sig.btn">Create Account</button>

            <p class="login-link">
                <span data-i18n="sig.have">Already have an account?</span>
                <a href="login.html" data-i18n="sig.login">Log In</a>
            </p>
        </form>
    </main>

    <div id="verifyModal" style="display: none; position: fixed; inset: 0; background: rgba(8, 20, 54, 0.5); backdrop-filter: blur(4px); z-index: 60; place-items: center; padding: 16px;">
        <div style="width: 100%; max-width: 400px; background: #fff; padding: 28px; border-radius: 24px; box-shadow: 0 24px 56px rgba(20, 50, 120, 0.16); animation: pop 0.22s ease;">
            <h2 style="margin: 0 0 8px; font-size: 20px; font-weight: 800; color: #0c1b3a;">Verify your email</h2>
            <p style="margin: 0 0 20px; font-size: 14.5px; color: #6b7794; line-height: 1.55;">We sent a 6-digit code to <strong id="verifyEmail" style="color: #0c1b3a;"></strong></p>
            
            <label style="display: block; font-size: 13px; font-weight: 700; color: #3a4764; margin-bottom: 14px;">
                Verification Code
                <input type="text" id="verifyCode" maxlength="6" placeholder="000000" autocomplete="one-time-code" style="display: block; width: 100%; margin-top: 6px; height: 46px; padding: 0 14px; border: 1.5px solid #e2e8f4; border-radius: 12px; background: #fff; color: #0c1b3a; font-size: 18px; letter-spacing: 4px; text-align: center; outline: none;">
            </label>
            
            <div style="color: #c42b2b; font-size: 13.5px; font-weight: 600; min-height: 18px; margin: 0 0 16px;" id="verifyError"></div>
            
            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button type="button" id="cancelVerifyBtn" style="background: #fff; border: 1px solid #cdd6e8; color: #3a4764; border-radius: 999px; padding: 10px 18px; font-weight: 600; font-size: 14.5px; cursor: pointer;">Cancel</button>
                <button type="button" id="verifyBtn" style="background: #1f5fd6; color: #fff; border: 0; border-radius: 999px; padding: 11px 20px; font-weight: 700; font-size: 14.5px; cursor: pointer; box-shadow: 0 6px 16px rgba(31, 95, 214, 0.28);">Verify</button>
            </div>
        </div>
    </div>

        <script>
const byId = (id) => document.getElementById(id);

const fields = {
    name: ["name", "nameMsg"],
    id: ["email", "idMsg"],
    pw: ["password", "pwMsg"],
    cf: ["confirmPassword", "cfMsg"]
};

const LOCAL = {
    "err.server": { en: "Open the app through its backend server.", fil: "Buksan ang app sa backend server." },
    "err.fail": { en: "Unable to create your account.", fil: "Hindi magawa ang iyong account." },
    "err.network": { en: "Can't reach the server.", fil: "Hindi makakonekta sa server." },
    "err.database": { en: "Database unavailable.", fil: "Hindi maabot ang database." },
    "err.auth": { en: "Service unreachable.", fil: "Hindi maabot ang serbisyo." },
};

function tr(key) {
    if (LOCAL[key]) return LOCAL[key][I18N.getLang()] || LOCAL[key].en;
    return I18N.t(key);
}

const errs = {};

function setErr(key, msgKey) {
    const [inputId, msgId] = fields[key];
    errs[key] = msgKey || null;
    byId(msgId).textContent = msgKey ? tr(msgKey) : "";
    byId(inputId).classList.toggle("invalid", !!msgKey);
}

function clearAll() {
    Object.keys(fields).forEach((key) => setErr(key, ""));
}

Object.keys(fields).forEach((key) => {
    byId(fields[key][0]).addEventListener("input", () => setErr(key, ""));
});

function validateName(name) {
    return name ? "" : "prof.err.name";
}

function validatePassword(pw) {
    if (pw.length < 8) return "sig.err.len";
    if (!/[A-Za-z]/.test(pw) || !/\d/.test(pw)) return "sig.err.mix";
    return "";
}

function validateConfirm(pw, cf) {
    if (!cf) return "sig.err.cf";
    if (pw !== cf) return "sig.err.match";
    return "";
}

// Force the input to only accept numbers
byId("verifyCode").addEventListener("input", (e) => {
    e.target.value = e.target.value.replace(/\D/g, '');
});

byId("signupForm").addEventListener("submit", (e) => {
    e.preventDefault();
    clearAll();

    const name = byId("name").value.trim();
    const raw = byId("email").value.trim();
    const pw = byId("password").value;
    const cf = byId("confirmPassword").value;

    const errors = {
        name: validateName(name),
        id: Auth.validId(raw) ? "" : "sig.err.id",
        pw: validatePassword(pw),
        cf: validateConfirm(pw, cf)
    };

    if (errors.pw && errors.cf === "sig.err.match") {
        errors.cf = "";
    }

    let firstInvalid = null;
    for (const key of Object.keys(fields)) {
        setErr(key, errors[key]);
        if (errors[key] && !firstInvalid) firstInvalid = key;
    }

    if (firstInvalid) {
        byId(fields[firstInvalid][0]).focus();
        return;
    }

    const submitBtn = byId("submitBtn");
    submitBtn.disabled = true;
    submitBtn.textContent = "Sending...";

    const res = Auth.createUser(Auth.normalize(raw), pw, { name: name });

    if (!res.ok) {
        submitBtn.disabled = false;
        submitBtn.textContent = "Create Account";
        setErr("id", res.error);
        byId("email").focus();
        return;
    }

    if (res.needs_verification) {
        submitBtn.disabled = false;
        submitBtn.textContent = "Create Account";
        byId("verifyEmail").textContent = raw;
        byId("verifyModal").style.display = "grid";
        byId("verifyCode").focus();
        return;
    }

    location.href = "login.html?created=1";
});

byId("cancelVerifyBtn").addEventListener("click", () => {
    byId("verifyModal").style.display = "none";
    byId("verifyError").textContent = "";
    byId("verifyCode").value = "";
});

byId("verifyBtn").addEventListener("click", () => {
    const code = byId("verifyCode").value.trim();
    const raw = byId("email").value.trim();
    const verifyBtn = byId("verifyBtn");
    
    if (code.length !== 6) {
        byId("verifyError").textContent = "Please enter a 6-digit code.";
        return;
    }

    verifyBtn.disabled = true;
    verifyBtn.textContent = "Verifying...";

    const res = Auth.verifySignup(Auth.normalize(raw), code);
    
    if (!res.ok) {
        byId("verifyError").textContent = "Error: " + (res.error || "Unknown");
        verifyBtn.disabled = false;
        verifyBtn.textContent = "Verify";
        return;
    }
    location.href = "../index.html";
});
    </script>
</body>
</html>
